<!doctype html>
<html lang="es">
  <head>
    <script>
      (function() {
        try {
          if (typeof window !== "undefined" && window.fetch) {
            const originalFetch = window.fetch;
            let customFetch = originalFetch;
            Object.defineProperty(window, "fetch", {
              get() { return customFetch; },
              set(value) { customFetch = value; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn("Early fetch patch skipped:", e);
        }
      })();
    </script>
